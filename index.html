<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест · Какая профессия третичного сектора — твоя?</title>
<style>
  :root{
    --bg-1:#1a0a1e; --bg-2:#2a1228;
    --coral:#ff6b6b; --coral-light:#ff9b9b; --coral-dark:#c92a2a; --coral-soft:#ffe3e3;
    --teal:#14b8a6; --gold:#fbbf24; --blue:#3b82f6; --purple:#a855f7;
    --card:#fff; --card-soft:#f8fafc;
    --ink:#0f172a; --soft:#64748b; --line:#e2e8f0;
    --ok:#10b981; --err:#ef4444;
    --shadow-card:0 20px 50px rgba(0,0,0,.45);
    --shadow-coral:0 10px 30px rgba(255,107,107,.4);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,'Nunito',sans-serif;
    background:radial-gradient(ellipse at top left,#3d1a2e 0%,transparent 50%),
      radial-gradient(ellipse at bottom right,#1a0a1e 0%,transparent 50%),
      linear-gradient(180deg,var(--bg-1) 0%,var(--bg-2) 100%);
    background-attachment:fixed; color:var(--ink); min-height:100vh; overflow-x:hidden}
  #bgFX{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  #bgFX .bg-item{position:absolute;bottom:-20vh;display:block;opacity:0;
    animation-name:rise;animation-timing-function:linear;animation-iteration-count:infinite;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,.4))}
  @keyframes rise{0%{transform:translate3d(0,0,0) rotate(0deg);opacity:0}
    8%{opacity:var(--op,.10)}92%{opacity:var(--op,.10)}
    100%{transform:translate3d(var(--dx,0),-140vh,0) rotate(var(--rot,15deg));opacity:0}}
  .glow{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
  .glow.g1{width:420px;height:420px;background:rgba(255,107,107,.12);top:-100px;left:-100px}
  .glow.g2{width:380px;height:380px;background:rgba(20,184,166,.10);top:40%;right:-120px}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:150;overflow:hidden}
  .particle{position:absolute;font-size:20px;animation:fall 1.5s linear forwards}
  @keyframes fall{to{transform:translateY(115vh) rotate(540deg);opacity:0}}
  .wrap{max-width:820px;margin:0 auto;padding:22px 16px 80px;position:relative;z-index:2}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:12px;color:#fff}
  .brand-logo{width:44px;height:44px;border-radius:13px;flex-shrink:0;
    background:linear-gradient(135deg,var(--coral),var(--gold));
    display:flex;align-items:center;justify-content:center;font-size:22px;
    box-shadow:var(--shadow-coral);position:relative}
  .brand-logo::after{content:"";position:absolute;inset:3px;border-radius:10px;
    border:1.5px solid rgba(255,255,255,.4)}
  .brand-text{display:flex;flex-direction:column;line-height:1.1}
  .brand-text b{font-size:15px;color:#fff;font-weight:900}
  .brand-text span{font-size:11.5px;font-weight:700;color:var(--coral-light);
    letter-spacing:.5px;text-transform:uppercase}
  .card{background:var(--card);border-radius:24px;box-shadow:var(--shadow-card);padding:30px;
    position:relative;overflow:hidden;animation:pop .4s ease}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;
    background:linear-gradient(90deg,var(--coral),var(--gold),var(--teal))}
  @keyframes pop{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .intro-hero{text-align:center;padding:10px 0 20px}
  .intro-hero .ih-emoji{font-size:80px;display:inline-block;
    animation:float 3s ease-in-out infinite;margin-bottom:10px;
    filter:drop-shadow(0 10px 24px rgba(255,107,107,.35))}
  .intro-hero h1{font-size:clamp(24px,4vw,32px);margin:8px 0 12px;letter-spacing:-.6px;
    font-weight:900;line-height:1.2;color:var(--ink)}
  .intro-hero h1 span{background:linear-gradient(135deg,var(--coral-dark),var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .intro-hero p{font-size:15px;line-height:1.7;color:var(--soft);margin:0 auto;
    max-width:540px;font-weight:500}
  .intro-hero p b{color:var(--ink);font-weight:800}
  .intro-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:12px;margin:24px 0}
  .stat-card{background:linear-gradient(135deg,#f8fafc,#eef2f7);border:1px solid var(--line);
    border-radius:14px;padding:16px 14px;text-align:center}
  .stat-card .sc-emoji{font-size:28px;display:block;margin-bottom:6px}
  .stat-card .sc-num{font-size:22px;font-weight:900;color:var(--ink);line-height:1}
  .stat-card .sc-label{font-size:11px;font-weight:800;color:var(--soft);
    letter-spacing:.5px;text-transform:uppercase;margin-top:6px}
  .start-btn{width:100%;padding:18px 26px;font-family:inherit;font-weight:900;font-size:17px;
    background:linear-gradient(135deg,var(--coral),var(--gold));color:#1a0a1e;border:none;
    border-radius:16px;cursor:pointer;box-shadow:var(--shadow-coral);transition:.2s;
    display:flex;align-items:center;justify-content:center;gap:10px}
  .start-btn:hover{filter:brightness(1.08);transform:translateY(-2px)}
  .start-btn:active{transform:scale(.98)}
  .progress-row{display:flex;justify-content:space-between;align-items:center;
    margin-bottom:14px;font-size:12.5px;font-weight:800;color:var(--soft);letter-spacing:.3px}
  .progress-row .pr-num{background:var(--coral-soft);color:var(--coral-dark);
    padding:4px 12px;border-radius:999px;font-size:11.5px;font-weight:900}
  .progress-bar{height:10px;background:#e2e8f0;border-radius:5px;overflow:hidden;margin-bottom:22px}
  .progress-bar>div{height:100%;width:0;
    background:linear-gradient(90deg,var(--coral),var(--gold));border-radius:5px;
    transition:width .4s ease}
  .question-emoji{font-size:56px;display:block;margin-bottom:14px;
    filter:drop-shadow(0 6px 16px rgba(255,107,107,.25));animation:float 3s ease-in-out infinite}
  .question-text{font-size:clamp(20px,3vw,24px);font-weight:900;color:var(--ink);
    line-height:1.3;margin:0 0 22px;letter-spacing:-.3px}
  .options{display:grid;gap:10px}
  .option-btn{display:flex;align-items:center;gap:14px;padding:16px 18px;
    background:linear-gradient(135deg,#f8fafc,#eef2f7);border:2px solid var(--line);
    border-radius:14px;cursor:pointer;font-family:inherit;font-size:15px;
    font-weight:700;color:var(--ink);text-align:left;transition:.2s;line-height:1.4}
  .option-btn:hover{border-color:var(--coral);
    background:linear-gradient(135deg,#fff5f5,#ffe3e3);transform:translateX(4px)}
  .option-btn:active{transform:scale(.98)}
  .option-btn .ob-letter{flex-shrink:0;width:36px;height:36px;border-radius:10px;
    background:linear-gradient(135deg,var(--coral-dark),var(--coral));color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;
    box-shadow:0 4px 10px rgba(201,42,42,.35)}
  .option-btn .ob-text{flex:1}
  .option-btn .ob-arrow{color:var(--coral-dark);font-weight:900;font-size:16px;
    opacity:0;transition:.2s}
  .option-btn:hover .ob-arrow{opacity:1;transform:translateX(2px)}
  .back-row{margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .back-btn{padding:10px 18px;font-family:inherit;font-weight:800;font-size:13px;
    background:transparent;color:var(--soft);border:1px solid var(--line);
    border-radius:10px;cursor:pointer;transition:.2s}
  .back-btn:hover:not(:disabled){background:#f1f5f9;color:var(--ink)}
  .back-btn:disabled{opacity:.4;cursor:not-allowed}
  .back-hint{font-size:12px;color:var(--soft);font-weight:600}
  .result-hero{text-align:center;padding:8px 0 22px}
  .result-hero .rh-medal{font-size:80px;display:inline-block;
    animation:float 3s ease-in-out infinite;margin-bottom:10px;
    filter:drop-shadow(0 12px 30px rgba(251,191,36,.5))}
  .result-hero .rh-tag{display:inline-block;padding:6px 16px;background:var(--coral-soft);
    color:var(--coral-dark);border-radius:999px;font-size:11.5px;font-weight:900;
    letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
  .result-hero h2{font-size:clamp(26px,4vw,34px);margin:6px 0 8px;
    letter-spacing:-.6px;font-weight:900;line-height:1.15;color:var(--ink)}
  .result-hero .rh-prof{display:inline-block;
    background:linear-gradient(135deg,var(--coral-dark),var(--gold));color:#fff;
    padding:12px 26px;border-radius:14px;font-size:20px;font-weight:900;margin:8px 0;
    box-shadow:var(--shadow-coral)}
  .result-hero .rh-why{font-size:14.5px;line-height:1.65;color:var(--soft);
    max-width:520px;margin:14px auto 0;font-weight:500}
  .result-hero .rh-why b{color:var(--ink);font-weight:800}
  .traits-row{margin:18px 0;padding:16px;background:linear-gradient(135deg,#fff5f5,#ffe3e3);
    border-radius:14px;border-left:4px solid var(--coral)}
  .traits-row .tr-title{font-size:12px;font-weight:900;letter-spacing:.5px;
    text-transform:uppercase;color:var(--coral-dark);margin-bottom:10px}
  .traits-chips{display:flex;flex-wrap:wrap;gap:6px}
  .trait-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;
    background:#fff;border:1px solid var(--coral);border-radius:999px;
    font-size:12.5px;font-weight:800;color:var(--coral-dark)}
  .top-list{display:grid;gap:10px;margin:20px 0}
  .top-item{background:linear-gradient(135deg,#f8fafc,#eef2f7);border:2px solid var(--line);
    border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px;
    transition:.2s}
  .top-item:hover{border-color:var(--coral);transform:translateX(2px)}
  .top-item.first{background:linear-gradient(135deg,#fef3c7,#fde68a);border-color:var(--gold)}
  .top-item .ti-medal{font-size:26px;flex-shrink:0;width:36px;text-align:center}
  .top-item .ti-body{flex:1;min-width:0}
  .top-item .ti-name{font-size:15px;font-weight:900;color:var(--ink);line-height:1.3;
    margin-bottom:3px}
  .top-item .ti-cat{font-size:11.5px;font-weight:700;color:var(--soft)}
  .top-item .ti-bar{height:6px;background:#fff;border-radius:3px;margin-top:6px;
    overflow:hidden;border:1px solid var(--line)}
  .top-item .ti-bar>div{height:100%;
    background:linear-gradient(90deg,var(--coral),var(--gold));border-radius:3px;
    transition:width .6s ease}
  .top-item .ti-percent{font-size:14px;font-weight:900;color:var(--coral-dark);flex-shrink:0}
  .top-item .ti-detail{flex-shrink:0;padding:8px 14px;font-family:inherit;
    font-weight:800;font-size:12px;background:var(--coral);color:#fff;
    border:none;border-radius:10px;cursor:pointer;transition:.2s;white-space:nowrap}
  .top-item .ti-detail:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .chart-section{margin:26px 0 18px;padding:20px;
    background:linear-gradient(135deg,#f8fafc,#eef2f7);
    border:1px solid var(--line);border-radius:18px}
  .chart-title{font-size:13px;font-weight:900;letter-spacing:.5px;
    text-transform:uppercase;color:var(--soft);margin-bottom:14px;
    display:flex;align-items:center;gap:8px}
  .chart-title::after{content:"";flex:1;height:1px;background:var(--line)}
  .chart-rows{display:grid;gap:8px}
  .chart-row{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;
    padding:8px 10px;background:#fff;border:1px solid var(--line);border-radius:10px;
    transition:.15s;cursor:pointer}
  .chart-row:hover{border-color:var(--coral);box-shadow:0 4px 12px rgba(255,107,107,.15)}
  .chart-row.first{background:linear-gradient(135deg,#fef3c7,#fde68a);border-color:var(--gold)}
  .chart-row .cr-head{display:flex;align-items:center;gap:8px;font-size:13px;
    font-weight:800;color:var(--ink);min-width:0}
  .chart-row .cr-emoji{font-size:18px;flex-shrink:0}
  .chart-row .cr-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chart-row .cr-percent{font-size:12.5px;font-weight:900;color:var(--coral-dark);
    grid-column:2;grid-row:1}
  .chart-row .cr-bar-wrap{grid-column:1/-1;height:10px;background:#f1f5f9;
    border-radius:5px;overflow:hidden;border:1px solid var(--line)}
  .chart-row .cr-bar{height:100%;border-radius:5px;
    transition:width .8s cubic-bezier(.2,.9,.3,1.2);
    background:linear-gradient(90deg,var(--coral),var(--gold))}
  .chart-row.cat-trade .cr-bar{background:linear-gradient(90deg,#a855f7,#7c3aed)}
  .chart-row.cat-food .cr-bar{background:linear-gradient(90deg,#f97316,#ea580c)}
  .chart-row.cat-transport .cr-bar{background:linear-gradient(90deg,#3b82f6,#1e40af)}
  .chart-row.cat-tourism .cr-bar{background:linear-gradient(90deg,#14b8a6,#0f766e)}
  .chart-row.cat-education .cr-bar{background:linear-gradient(90deg,#22c55e,#15803d)}
  .chart-row.cat-medicine .cr-bar{background:linear-gradient(90deg,#ec4899,#be185d)}
  .chart-row.cat-finance .cr-bar{background:linear-gradient(90deg,#eab308,#a16207)}
  .chart-row.cat-entertainment .cr-bar{background:linear-gradient(90deg,#fb923c,#c2410c)}
  .action-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
  .action-row button{flex:1;min-width:140px;padding:14px 20px;font-family:inherit;
    font-weight:800;font-size:14px;border-radius:13px;border:none;cursor:pointer;transition:.2s}
  .btn-primary{background:linear-gradient(135deg,var(--coral),var(--gold));color:#1a0a1e;
    box-shadow:var(--shadow-coral)}
  .btn-primary:hover{filter:brightness(1.08);transform:translateY(-2px)}
  .btn-secondary{background:var(--card-soft);color:var(--ink);border:1px solid var(--line)}
  .btn-secondary:hover{background:#eef2f7}
  .btn-print{background:linear-gradient(135deg,var(--purple),#7c3aed);color:#fff;
    box-shadow:0 10px 26px rgba(168,85,247,.35)}
  .btn-print:hover{filter:brightness(1.08);transform:translateY(-2px)}
  .modal-overlay{position:fixed;inset:0;background:rgba(20,5,20,.85);backdrop-filter:blur(8px);
    z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;
    opacity:0;pointer-events:none;transition:.25s}
  .modal-overlay.open{opacity:1;pointer-events:auto}
  .modal{background:#fff;border-radius:24px;max-width:680px;width:100%;max-height:92vh;
    overflow-y:auto;box-shadow:0 40px 100px rgba(0,0,0,.7);transform:scale(.94);
    transition:.28s cubic-bezier(.2,.9,.3,1.2)}
  .modal-overlay.open .modal{transform:scale(1)}
  .modal-head{padding:26px 28px 20px;position:relative;color:#fff;
    border-radius:24px 24px 0 0;overflow:hidden}
  .modal-head.cat-trade{background:linear-gradient(135deg,#7c3aed,#a855f7)}
  .modal-head.cat-food{background:linear-gradient(135deg,#ea580c,#f97316)}
  .modal-head.cat-transport{background:linear-gradient(135deg,#1e40af,#3b82f6)}
  .modal-head.cat-tourism{background:linear-gradient(135deg,#0f766e,#14b8a6)}
  .modal-head.cat-education{background:linear-gradient(135deg,#15803d,#22c55e)}
  .modal-head.cat-medicine{background:linear-gradient(135deg,#be185d,#ec4899)}
  .modal-head.cat-finance{background:linear-gradient(135deg,#a16207,#eab308)}
  .modal-head.cat-entertainment{background:linear-gradient(135deg,#c2410c,#fb923c)}
  .modal-head::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg,var(--gold),var(--coral));z-index:2}
  .mh-emoji{font-size:52px;line-height:1;margin-bottom:10px;
    filter:drop-shadow(0 6px 16px rgba(0,0,0,.3))}
  .modal-head h2{margin:0;font-size:21px;font-weight:900;line-height:1.25}
  .modal-head .mh-cat{display:inline-block;padding:3px 12px;border-radius:999px;
    font-size:11px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;margin-top:8px;
    background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(4px)}
  .modal-close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;
    border:none;background:rgba(255,255,255,.18);color:#fff;font-size:18px;font-weight:900;
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;z-index:3}
  .modal-close:hover{background:rgba(255,255,255,.32);transform:rotate(90deg)}
  .modal-body{padding:22px 26px 26px}
  .m-section{margin-bottom:22px}
  .m-section:last-child{margin-bottom:0}
  .m-section-title{font-size:11.5px;font-weight:900;letter-spacing:1px;
    text-transform:uppercase;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .m-section-title::after{content:"";flex:1;height:1px;
    background:linear-gradient(90deg,currentColor,transparent);opacity:.3}
  .m-section-title.icon-about{color:var(--coral-dark)}
  .m-section-title.icon-track{color:#a16207}
  .m-section-title.icon-feat{color:var(--blue)}
  .m-section-title.icon-opp{color:var(--ok)}
  .m-section-title.icon-risk{color:var(--err)}
  .m-section-title.icon-fact{color:var(--purple)}
  .m-desc{font-size:14px;line-height:1.65;color:var(--ink);font-weight:500;
    background:linear-gradient(135deg,#fff5f5,#ffe3e3);padding:14px 16px;border-radius:12px;
    border-left:4px solid var(--coral)}
  .career-track{display:flex;gap:0;flex-wrap:nowrap;overflow-x:auto;padding:6px 0 12px}
  .career-step{display:flex;flex-direction:column;align-items:center;gap:6px;
    min-width:110px;flex:1;position:relative;text-align:center;padding:0 4px}
  .career-step:not(:last-child)::after{content:"→";position:absolute;right:-8px;top:18px;
    font-size:18px;color:var(--coral);font-weight:900}
  .career-step .cs-num{width:40px;height:40px;border-radius:50%;
    background:linear-gradient(135deg,var(--coral),var(--coral-dark));color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;
    box-shadow:0 6px 14px rgba(255,107,107,.4)}
  .career-step:nth-child(2) .cs-num{background:linear-gradient(135deg,#fbbf24,#d97706)}
  .career-step:nth-child(3) .cs-num{background:linear-gradient(135deg,#3b82f6,#1e40af)}
  .career-step:nth-child(4) .cs-num{background:linear-gradient(135deg,#a78bfa,#7c3aed)}
  .career-step:nth-child(5) .cs-num{background:linear-gradient(135deg,#14b8a6,#0f766e)}
  .career-step .cs-title{font-size:11.5px;font-weight:900;color:var(--ink);line-height:1.3}
  .career-step .cs-years{font-size:10px;font-weight:700;color:var(--soft);
    background:#f1f5f9;padding:2px 7px;border-radius:999px}
  .salary-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .salary-card{background:linear-gradient(135deg,#f8fafc,#eef2f7);border-radius:11px;
    padding:10px 8px;text-align:center;border:1px solid var(--line)}
  .salary-card .sc-label{font-size:10px;font-weight:900;letter-spacing:.4px;
    text-transform:uppercase;color:var(--soft);margin-bottom:3px}
  .salary-card .sc-value{font-size:14px;font-weight:900;color:var(--coral-dark);line-height:1.2}
  .salary-card .sc-sub{font-size:10px;color:var(--soft);font-weight:600;margin-top:2px}
  .m-list{list-style:none;padding:0;margin:0;display:grid;gap:7px}
  .m-list li{padding:10px 13px;border-radius:11px;font-size:13px;line-height:1.5;
    font-weight:500;display:flex;gap:9px;align-items:flex-start}
  .m-list li .ml-icon{flex-shrink:0;font-size:15px;line-height:1.4}
  .m-list li .ml-text{flex:1}
  .m-list li .ml-text b{font-weight:900}
  .m-list.feat li{background:linear-gradient(135deg,#eff6ff,#dbeafe);border-left:3px solid var(--blue)}
  .m-list.feat li .ml-text b{color:#1e40af}
  .m-list.opp li{background:linear-gradient(135deg,#f0fdf4,#dcfce7);border-left:3px solid var(--ok)}
  .m-list.opp li .ml-text b{color:#166534}
  .m-list.risk li{background:linear-gradient(135deg,#fef2f2,#fee2e2);border-left:3px solid var(--err)}
  .m-list.risk li .ml-text b{color:#991b1b}
  .fact-box{background:linear-gradient(135deg,#f3e8ff,#e9d5ff);padding:13px 16px;
    border-radius:12px;border-left:4px solid var(--purple);font-size:13.5px;line-height:1.55;
    color:#6b21a8;font-weight:600}

(function initBG(){
  const layer = document.getElementById('bgFX');
  if(!layer) return;
  try{if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){layer.style.display='none';return}}catch(e){}
  const SYMBOLS = ['🛎','🛒','🍽','🚚','🏨','🎓','🏥','💰','🎉','☕','🍕','🚕','✈️','📚','🩺','🏦','🎤','🎈','🛍','📦'];
  const COLORS = ['#ff6b6b','#ff9b9b','#fbbf24','#14b8a6','#a855f7','#ffffff','#3b82f6','#ec4899'];
  const COUNT = window.innerWidth < 600 ? 16 : 28;
  const frag = document.createDocumentFragment();
  for(let i=0;i<COUNT;i++){
    const wrap = document.createElement('span');
    wrap.className='bg-item'; wrap.setAttribute('aria-hidden','true');
    wrap.textContent=SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)];
    wrap.style.fontSize=(18+Math.random()*30).toFixed(1)+'px';
    wrap.style.left=(Math.random()*100).toFixed(2)+'vw';
    wrap.style.color=COLORS[Math.floor(Math.random()*COLORS.length)];
    wrap.style.setProperty('--op',(0.06+Math.random()*0.10).toFixed(3));
    wrap.style.setProperty('--dx',(Math.random()*200-100).toFixed(0)+'px');
    wrap.style.setProperty('--rot',(Math.random()*60-30).toFixed(0)+'deg');
    const dur=40+Math.random()*50;
    wrap.style.animationDuration=dur.toFixed(1)+'s';
    wrap.style.animationDelay=(-Math.random()*dur).toFixed(1)+'s';
    frag.appendChild(wrap);
  }
  layer.appendChild(frag);
})();

let AC=null;
function beep(freq=880,dur=0.15,type='sine'){
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),g=AC.createGain();
    o.connect(g);g.connect(AC.destination);
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.12,AC.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
    o.start();o.stop(AC.currentTime+dur+0.02)}catch(e){}
}
function soundClick(){beep(660,0.08)}
function soundOpen(){beep(880,0.12);beep(1100,0.1);setTimeout(()=>beep(1320,0.1),80)}
function soundSuccess(){beep(880,0.1);setTimeout(()=>beep(1046,0.1),90);setTimeout(()=>beep(1318,0.2),180)}

function confetti(n=30){
  const emo=['🛎','✨','🎉','🌟','💰','🏅','🎈','🍰','💎','⭐','🎊','🏆'];
  const fx=$('fx');
  for(let i=0;i<n;i++){
    const p=document.createElement('div');
    p.className='particle'; p.textContent=emo[Math.floor(Math.random()*emo.length)];
    p.style.left=Math.random()*100+'vw'; p.style.top='-30px';
    p.style.animationDuration=(1.1+Math.random()*1.2)+'s';
    p.style.fontSize=(16+Math.random()*18)+'px';
    fx.appendChild(p); setTimeout(()=>p.remove(),2500);
  }
}

}

function renderQuestion(){

  const letters = ['А','Б','В','Г','Д','Е'];
  main().innerHTML = `

          </button>`).join('')}

      <div class="back-row">

        <span class="back-hint">Выбери один вариант</span>
      </div>
    </section>`;
  document.querySelectorAll('.option-btn').forEach(btn=>{
    btn.addEventListener('click',()=>handleAnswer(+btn.dataset.i));
  });
  $('backBtn').addEventListener('click',()=>{
    if(state.currentQ>0){
      soundClick();
      state.currentQ--;
      if(state.answers[state.currentQ]){
        const removed=state.answers[state.currentQ];
        removed.tags.forEach(t=>{state.tags[t]=(state.tags[t]||0)-1});
      }
      state.answers = state.answers.slice(0,state.currentQ);
      renderQuestion();
    }
  });
}

function handleAnswer(idx){
  const q = QUESTIONS[state.currentQ];
  const opt = q.options[idx];
  soundClick();
  state.answers[state.currentQ] = {idx, tags: opt.tags};
  opt.tags.forEach(t=>{state.tags[t]=(state.tags[t]||0)+1});
  if(state.currentQ < QUESTIONS.length - 1){
    state.currentQ++;
    renderQuestion();
  } else {
    state.screen = 'result';
    renderResult();
  }
}

function calculateResults(){
  return Object.entries(PROFESSIONS).map(([id,p])=>{
    let score = 0;
    for(const [tag,weight] of Object.entries(p.tags)){
      score += (state.tags[tag]||0) * weight;
    }
    return {id, ...p, score};
  }).sort((a,b)=>b.score-a.score);
}

$('printOverlay').addEventListener('click',e=>{
  if(e.target===$('printOverlay')) $('printOverlay').classList.remove('open');
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if($('modalOverlay').classList.contains('open')) closeModal();
    if($('printOverlay').classList.contains('open')) $('printOverlay').classList.remove('open');
  }
});

function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).then(()=>true).catch(()=>fallbackCopy(text));
  }
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text){
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.left='-9999px';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta); return ok;
  }catch(e){return false}
}
